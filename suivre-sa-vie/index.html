<title>Suivre sa vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabinet d'étude — sommaire fixe à gauche, page centrale large et aérée sur papier ivoire,
   filets fins plutôt que cartes ombrées, une teinte patrimoniale discrète par domaine.
   Couleurs en canaux RGB pour profiter des opacités Tailwind (bg-ink/10…). */
:root{
  --bg:246 244 239; --surface:252 251 248; --ink:29 32 38; --muted:108 106 99; --line:224 220 210; --soft:238 235 227;
  --accent:36 66 54; --accent-soft:226 233 227; --gold:146 114 54; --warn:160 56 40; --ok:44 96 66;
  --btn:29 32 38; --btnink:252 251 248;
  --me:232 233 236; --me-ink:58 66 82;     --edu:228 232 240; --edu-ink:40 62 104;
  --fin:227 235 228; --fin-ink:44 96 66;   --sk:236 230 238;  --sk-ink:96 64 104;
  --sty:242 230 229; --sty-ink:128 44 52;  --pro:241 234 220; --pro-ink:122 90 30;
  --c:var(--me); --ci:var(--me-ink);
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:19 20 23; --surface:26 27 31; --ink:232 228 218; --muted:152 148 138; --line:50 50 54; --soft:35 36 40;
  --accent:158 196 172; --accent-soft:30 44 37; --gold:206 172 106; --warn:232 128 104; --ok:138 196 158;
  --btn:232 228 218; --btnink:22 23 26;
  --me:38 40 46; --me-ink:180 188 204;     --edu:30 37 52; --edu-ink:150 176 222;
  --fin:28 42 33; --fin-ink:138 196 158;   --sk:40 33 43;  --sk-ink:200 170 210;
  --sty:46 31 32; --sty-ink:226 150 154;   --pro:44 37 26; --pro-ink:222 184 116;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:19 20 23; --surface:26 27 31; --ink:232 228 218; --muted:152 148 138; --line:50 50 54; --soft:35 36 40;
  --accent:158 196 172; --accent-soft:30 44 37; --gold:206 172 106; --warn:232 128 104; --ok:138 196 158;
  --btn:232 228 218; --btnink:22 23 26;
  --me:38 40 46; --me-ink:180 188 204;     --edu:30 37 52; --edu-ink:150 176 222;
  --fin:28 42 33; --fin-ink:138 196 158;   --sk:40 33 43;  --sk-ink:200 170 210;
  --sty:46 31 32; --sty-ink:226 150 154;   --pro:44 37 26; --pro-ink:222 184 116;
  color-scheme:dark;
}
[data-c="me"]{--c:var(--me);--ci:var(--me-ink)}   [data-c="edu"]{--c:var(--edu);--ci:var(--edu-ink)}
[data-c="fin"]{--c:var(--fin);--ci:var(--fin-ink)} [data-c="sk"]{--c:var(--sk);--ci:var(--sk-ink)}
[data-c="sty"]{--c:var(--sty);--ci:var(--sty-ink)} [data-c="pro"]{--c:var(--pro);--ci:var(--pro-ink)}
html,body{background:rgb(var(--bg));color:rgb(var(--ink))}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;overflow-x:hidden}
h1,h2,h3,h4{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
.view{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.path{position:relative}
.path::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:1px;background:rgb(var(--line))}
.chk{appearance:none;width:18px;height:18px;flex:none;border:1.5px solid rgb(var(--line));border-radius:5px;display:grid;place-items:center;background:rgb(var(--surface));cursor:pointer;transition:all .15s}
.chk:hover{border-color:rgb(var(--ci))}
.chk:checked{background:rgb(var(--ci));border-color:rgb(var(--ci))}
.chk:checked::after{content:"";width:5px;height:9px;border:solid rgb(var(--surface));border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
.sidebar{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
</style>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
const rgb = v => `rgb(var(--${v}) / <alpha-value>)`;
tailwind.config = {
  theme:{ extend:{
    colors:{ bg:rgb('bg'), surface:rgb('surface'), ink:rgb('ink'), muted:rgb('muted'), line:rgb('line'), soft:rgb('soft'),
      accent:rgb('accent'), 'accent-soft':rgb('accent-soft'), gold:rgb('gold'), warn:rgb('warn'), ok:rgb('ok'), btn:rgb('btn'), btnink:rgb('btnink'),
      c:rgb('c'), ci:rgb('ci'), me:rgb('me'), 'me-ink':rgb('me-ink'), edu:rgb('edu'), 'edu-ink':rgb('edu-ink'), fin:rgb('fin'), 'fin-ink':rgb('fin-ink'),
      sk:rgb('sk'), 'sk-ink':rgb('sk-ink'), sty:rgb('sty'), 'sty-ink':rgb('sty-ink'), pro:rgb('pro'), 'pro-ink':rgb('pro-ink') },
    fontFamily:{ display:['"Cormorant Garamond"','Georgia','serif'], body:['Figtree','ui-sans-serif','system-ui','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','Menlo','monospace'] }
  }}
};
</script>

<div class="lg:grid lg:grid-cols-[256px_minmax(0,1fr)]">
  <aside id="sidebar" class="sidebar hidden lg:flex sticky top-0 flex-col border-r border-line bg-surface/70 px-5 py-8 overflow-y-auto no-scrollbar" aria-label="Navigation principale"></aside>
  <div class="min-w-0">
    <header class="lg:hidden sticky z-30 flex items-center justify-between gap-3 border-b border-line bg-bg/95 backdrop-blur px-4 py-3" style="top:env(safe-area-inset-top,0px)">
      <div class="min-w-0">
        <div class="font-display text-2xl font-semibold leading-none">Suivre sa vie</div>
        <div id="topbar-label" class="mt-1 truncate text-xs text-muted"></div>
      </div>
      <button id="menu-btn" type="button" class="rounded-lg border border-line px-3 py-1.5 text-sm font-medium cursor-pointer" aria-controls="drawer" aria-expanded="false">Menu</button>
    </header>
    <main id="main" class="mx-auto max-w-[1040px] px-4 sm:px-8 lg:px-14 pt-8 sm:pt-14 pb-24">
      <p class="text-muted">Chargement de ton espace…</p>
    </main>
  </div>
</div>
<div id="drawer" class="fixed inset-0 z-40 lg:hidden" hidden>
  <div id="drawer-scrim" class="absolute inset-0 bg-ink/30"></div>
  <nav id="drawer-panel" class="absolute inset-y-0 left-0 flex w-[min(300px,86vw)] flex-col overflow-y-auto bg-surface px-5 pb-8 shadow-2xl" style="padding-top:calc(env(safe-area-inset-top,0px) + 2rem)" aria-label="Navigation principale"></nav>
</div>

<script type="module" src="src/main.js"></script>
