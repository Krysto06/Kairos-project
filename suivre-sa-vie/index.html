<title>Suivre sa vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: journal de vie en onglets — une couleur pastel par domaine de vie, fond porcelaine aéré, chemins d'étapes verticaux. */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#1B2030; --muted:#646B80; --line:#E3E6EF; --soft:#EEF0F6;
  --me:#E3F3F5; --me-ink:#0E6F7D;
  --edu:#DCEAFE; --edu-ink:#1F5FB8;
  --fin:#D8F2E4; --fin-ink:#17774A;
  --sk:#EAE2FD; --sk-ink:#6A43C2;
  --sty:#FCE3EA; --sty-ink:#B2385B;
  --pro:#FFF0C7; --pro-ink:#8A6200;
  --gold:#C99A2E; --warn:#C2410C; --good:#17774A;
  --btn:#1B2030; --btn-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(27,32,48,.05),0 8px 24px -12px rgba(27,32,48,.12);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141B; --surface:#1A1D26; --ink:#ECEEF5; --muted:#9AA0B4; --line:#2A2E3A; --soft:#22252F;
  --me:#15302F; --me-ink:#7FD3DE; --edu:#1C2A42; --edu-ink:#8DB8FF; --fin:#16322A; --fin-ink:#7DDBA8;
  --sk:#2A2342; --sk-ink:#C3A8FF; --sty:#3A1F29; --sty-ink:#FF9DB8; --pro:#3A3016; --pro-ink:#F1C55B;
  --gold:#E3B94F; --warn:#FB923C; --good:#7DDBA8; --btn:#ECEEF5; --btn-ink:#12141B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141B; --surface:#1A1D26; --ink:#ECEEF5; --muted:#9AA0B4; --line:#2A2E3A; --soft:#22252F;
  --me:#15302F; --me-ink:#7FD3DE; --edu:#1C2A42; --edu-ink:#8DB8FF; --fin:#16322A; --fin-ink:#7DDBA8;
  --sk:#2A2342; --sk-ink:#C3A8FF; --sty:#3A1F29; --sty-ink:#FF9DB8; --pro:#3A3016; --pro-ink:#F1C55B;
  --gold:#E3B94F; --warn:#FB923C; --good:#7DDBA8; --btn:#ECEEF5; --btn-ink:#12141B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--edu-ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Header */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.05}
.brand h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sty) 62%);padding:0 .08em}
.brand p{margin:6px 0 0;color:var(--muted)}
.save{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save[data-s="saved"] i{background:var(--good)} .save[data-s="saving"] i{background:var(--gold)} .save[data-s="error"] i{background:var(--warn)}

/* Nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;transition:background .2s,border-color .2s}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c-ink)}
.tab:hover{border-color:var(--c-ink)}
.tab[aria-selected="true"]{background:var(--c);border-color:transparent;color:var(--c-ink)}
[data-c="me"]{--c:var(--me);--c-ink:var(--me-ink)} [data-c="edu"]{--c:var(--edu);--c-ink:var(--edu-ink)}
[data-c="fin"]{--c:var(--fin);--c-ink:var(--fin-ink)} [data-c="sk"]{--c:var(--sk);--c-ink:var(--sk-ink)}
[data-c="sty"]{--c:var(--sty);--c-ink:var(--sty-ink)} [data-c="pro"]{--c:var(--pro);--c-ink:var(--pro-ink)}

section.view{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){section.view{animation:none}*{transition:none!important}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:clamp(24px,3.6vw,32px);font-weight:800}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--btn);color:var(--btn-ink);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--warn)}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.in{width:100%;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{outline:none;border-color:var(--c-ink,var(--edu-ink));background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--c);color:var(--c-ink);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>b{display:block;height:100%;border-radius:99px;background:var(--c-ink);transition:width .5s ease}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:12.5px;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--ink);border:1px solid transparent}
.links a:hover{border-color:var(--c-ink,var(--ink))}
.links a::after{content:" ↗";color:var(--muted)}

/* Moi */
.profile{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;background:var(--me);border:0}
.mono{width:92px;height:92px;border-radius:28px;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;color:var(--me-ink);transform:rotate(-4deg)}
.profile h3{font-size:clamp(28px,4.5vw,40px);font-weight:800;line-height:1.05}
.profile .head{color:var(--me-ink);font-weight:600;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.fact{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.fact .v{font-weight:600;overflow-wrap:anywhere}
.fact .v.empty{color:var(--muted);font-weight:400;font-style:italic}
.motto{margin-top:14px;font-family:var(--display);font-size:18px;color:var(--me-ink)}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-top:14px}
@media (max-width:560px){.profile{grid-template-columns:1fr}.mono{width:72px;height:72px;font-size:34px;border-radius:22px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--c-ink)}
.tile .t{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:20px;font-weight:800}
.ring{flex:none}
.next{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.next:first-of-type{border-top:0}
.next .dot{width:34px;height:34px;flex:none;border-radius:11px;background:var(--c);color:var(--c-ink);display:grid;place-items:center;font-weight:800;font-size:12px;font-family:var(--mono)}
.next .go{margin-left:auto;color:var(--muted)}

/* Éducation */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;min-width:0}
.chip b{display:block;font-family:var(--display);font-size:16px}
.chip span{font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--edu);border-color:transparent}
.chip[aria-pressed="true"] b{color:var(--edu-ink)}
.track-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.track-head h3{font-size:24px;font-weight:800}
.track-head .bar{flex:1;min-width:140px}
ol.path{list-style:none;margin:18px 0 0;padding:0;position:relative}
ol.path::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.step{position:relative;display:grid;grid-template-columns:40px 1fr;gap:14px;padding-bottom:18px}
.node{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;z-index:1;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);transition:transform .15s}
.node:hover{transform:scale(1.07);border-color:var(--edu-ink)}
.step.done .node{background:var(--edu-ink);border-color:var(--edu-ink);color:var(--surface)}
.step .body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.step.done .body{background:var(--soft)}
.step.done .body h4{text-decoration:line-through;text-decoration-color:var(--muted)}
.step h4{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step p{margin:4px 0 0;color:var(--muted);font-size:14px}
.badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--edu);color:var(--edu-ink)}
.badge.exam{background:var(--pro);color:var(--pro-ink)}
.badge.mine{background:var(--sk);color:var(--sk-ink)}
.step.summit .node{width:40px;height:40px;border-color:var(--gold);color:var(--gold)}
.step.summit.done .node{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.step.summit .body{border:1.5px solid var(--gold);background:linear-gradient(135deg,var(--pro),var(--surface) 70%)}
.step.summit h4{font-family:var(--display);font-size:18px}
.summit-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--pro-ink)}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.del:hover{color:var(--warn)}
.nextup{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--edu);border-radius:16px;padding:16px 18px;margin-top:4px}
.nextup b{font-family:var(--display);font-size:18px;color:var(--edu-ink)}
.addrow{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;margin-top:14px}
@media (max-width:620px){.addrow{grid-template-columns:1fr}}

/* Finance */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:800;margin-top:2px}
.kpi.hero{background:var(--fin);border:0}
.kpi.hero .v{color:var(--fin-ink)}
.kpi input{font-family:var(--display);font-size:26px;font-weight:800;color:var(--fin-ink);background:transparent;border:0;border-bottom:2px dashed var(--fin-ink);width:100%;padding:0}
.kpi input:focus{outline:none;border-bottom-style:solid}
.compare{display:grid;gap:14px}
.crow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--soft)}
.stack>span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;font-family:var(--mono);white-space:nowrap;overflow:hidden;transition:flex-basis .5s}
.k-besoin{background:var(--edu);color:var(--edu-ink)} .k-envie{background:var(--sty);color:var(--sty-ink)} .k-epargne{background:var(--fin);color:var(--fin-ink)} .k-reste{background:transparent;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.lines tr:first-child td{border-top:0}
.lines .in{padding:7px 10px}
.lines .amt{width:120px;text-align:right;font-family:var(--mono)}
.lines .pct{width:52px;text-align:right;font-size:12.5px;color:var(--muted)}
.lines select.in{width:128px}
.tablewrap{overflow-x:auto}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--pro);color:var(--pro-ink);margin-bottom:14px}
.insight{font-size:14px;margin:12px 0 0;padding-left:12px;border-left:3px solid var(--fin-ink)}

/* Skills */
.skill h3{font-size:20px;font-weight:800}
.skill .top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mods{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mod{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:10px;cursor:pointer}
.mod:hover{background:var(--soft)}
.mod input{appearance:none;width:20px;height:20px;flex:none;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.mod input:checked{background:var(--sk-ink);border-color:var(--sk-ink)}
.mod input:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mod input:checked + span{color:var(--muted);text-decoration:line-through}
.mod small{display:block;color:var(--muted);font-size:12.5px;text-decoration:none}

/* Style */
.look{padding:0;overflow:hidden;display:flex;flex-direction:column}
.outfit{display:grid;grid-template-columns:repeat(var(--n),1fr);height:120px}
.outfit span{display:flex;align-items:flex-end;padding:8px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.look .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.look h3{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.look ul{margin:0;padding-left:18px;font-size:14px}
.look .tip{font-size:13.5px;color:var(--sty-ink);background:var(--sty);padding:8px 10px;border-radius:10px}
.heart{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.heart svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.heart[aria-pressed="true"]{border-color:var(--sty-ink);background:var(--sty)}
.heart[aria-pressed="true"] svg{fill:var(--sty-ink);stroke:var(--sty-ink)}
.look .links{margin-top:auto}
.capsule{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-top:12px}
.capsule label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:14px}
.capsule input{accent-color:var(--sty-ink);width:17px;height:17px}
.capsule label:has(input:checked){background:var(--sty);border-color:transparent;color:var(--sty-ink);font-weight:600}

/* Projets */
.proj{display:flex;flex-direction:column;gap:10px}
.proj h3{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.proj .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj .nx{font-size:14px}
.proj .nx b{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:block}
.proj .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.st-idee{--c:var(--soft);--c-ink:var(--muted)} .st-cours{--c:var(--edu);--c-ink:var(--edu-ink)} .st-pause{--c:var(--pro);--c-ink:var(--pro-ink)} .st-fini{--c:var(--fin);--c-ink:var(--fin-ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--pro);border-color:transparent;color:var(--pro-ink)}
.empty{text-align:center;padding:36px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="eyebrow" id="today"></p>
      <h1>Suivre sa <em>vie</em></h1>
      <p id="greet">Ton tableau de bord personnel : études, argent, compétences, style et projets.</p>
    </div>
    <span class="save" id="save" data-s="idle"><i></i><span>Chargement…</span></span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="moi" data-c="me"><i></i>Moi</button>
    <button class="tab" role="tab" data-tab="education" data-c="edu"><i></i>Éducation</button>
    <button class="tab" role="tab" data-tab="finance" data-c="fin"><i></i>Finance</button>
    <button class="tab" role="tab" data-tab="skills" data-c="sk"><i></i>Skills</button>
    <button class="tab" role="tab" data-tab="style" data-c="sty"><i></i>Style</button>
    <button class="tab" role="tab" data-tab="projets" data-c="pro"><i></i>Projets</button>
  </nav>

  <main id="main"></main>
  <footer>Suivre sa vie · tes coches et tes chiffres sont enregistrés automatiquement.</footer>
</div>

<script>
/* ---------- Contenu ---------- */
const TRACKS = [
  { id:'en', title:'Anglais → C2', sub:'De A1 à C2, puis DET & TOEFL', desc:'Un niveau à la fois, avec un test gratuit à mi-chemin et les deux examens officiels comme sommet.',
    steps:[
      {id:'en-a1',lvl:'A1',t:'Découverte',d:'Se présenter, chiffres, vie quotidienne. 20 minutes par jour suffisent.',links:[['Duolingo','https://www.duolingo.com'],['BBC Learning English','https://www.bbc.co.uk/learningenglish']]},

const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className=v;
    else if (k==='style') el.style.cssText=v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if (k==='html') el.innerHTML=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat(9)){ if (c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const uid = () => Math.random().toString(36).slice(2,9);
const stable = v => Array.isArray(v) ? '['+v.map(stable).join(',')+']' : (v && typeof v==='object') ? '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}' : JSON.stringify(v);
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function fmt(n){ const c=S.budget.currency; const s=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n||0)); return c==='FCFA'||c==='HTG'||c==='CHF' ? s+' '+c : (c==='$'?'$'+s : s+' '+c) }
function ring(p, color, size=46){
  const r=(size-6)/2, C=2*Math.PI*r, off=C*(1-Math.max(0,Math.min(1,p)));
  const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
  svg.setAttribute('width',size); svg.setAttribute('height',size); svg.setAttribute('class','ring'); svg.setAttribute('viewBox',`0 0 ${size} ${size}`);
  svg.innerHTML=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" dy=".35em" text-anchor="middle" font-size="${size*.25}" font-family="JetBrains Mono,monospace" font-weight="600" fill="var(--ink)">${Math.round(p*100)}</text>`;
  return svg;
}

async function flush(){

function trackSteps(tr){
  const custom = (S.custom[tr.id]||[]).map(c=>({id:c.id,t:c.t,d:c.d||'',links:c.url?[['Ouvrir le lien',c.url]]:[],mine:true}));
  const i = tr.steps.findIndex(s=>s.summit);
  return i<0 ? tr.steps.concat(custom) : tr.steps.slice(0,i).concat(custom, tr.steps.slice(i));
}
const isDone = id => S.done.includes(id);
function trackProg(tr){ const st=trackSteps(tr); const d=st.filter(s=>isDone(s.id)).length; return {d, n:st.length, p: st.length? d/st.length:0}; }
function skillProg(sk){ const d=sk.mods.filter((m,i)=>S.skillsDone.includes(sk.id+':'+i)).length; return {d,n:sk.mods.length,p:d/sk.mods.length}; }
function budgetCalc(){
  const b=S.budget, sal=+b.salary||0, by={besoin:0,envie:0,epargne:0};
  for (const l of b.lines) by[l.kind]=(by[l.kind]||0)+(+l.amount||0);
  const spent=by.besoin+by.envie+by.epargne;
  return {sal, by, spent, rest: sal-spent, saveRate: sal? (by.epargne+Math.max(0,sal-spent))/sal : 0};
}

function vFin(){

    if (!c.sal) insight.textContent='Entre ton salaire net du mois pour voir la répartition.';

    else { const e=c.by.epargne/c.sal; insight.textContent = e>=.2 ? `Bravo : ${Math.round(e*100)} % de ton salaire va à l’épargne et à l’avenir. Tu dépasses l’objectif de 20 %.` : `Tu mets ${Math.round(e*100)} % de côté. Pour atteindre 20 %, il faudrait ${fmt(.2*c.sal-c.by.epargne)} de plus par mois. Les ${fmt(c.rest)} non affectés peuvent servir.`; }

    h('td',{},h('input',{class:'in amt',id:'ba-'+l.id,type:'number',min:0,step:5,inputmode:'decimal',value:l.amount||'',placeholder:'0','aria-label':'Montant',oninput:e=>{l.amount=+e.target.value||0;b.example=false;save();paint();}})),
    pctCells[l.id]=h('td',{class:'pct num'}),
    h('td',{},h('button',{class:'del','aria-label':'Supprimer '+l.label,onclick:()=>{b.lines=b.lines.filter(x=>x.id!==l.id);save();render();}},'✕')))));

    h('div',{class:'sec-head'},h('div',{},h('h2',{},'Finance'),h('p',{},'Ton salaire, ton budget du mois, et la comparaison avec la règle 50/30/20.')),
      h('div',{class:'field'},h('label',{for:'cur'},'Devise'),h('select',{class:'in',id:'cur',onchange:e=>{b.currency=e.target.value;save();render();}},['€','$','CHF','FCFA','HTG','CAD'].map(c=>h('option',{value:c,selected:b.currency===c},c))))),

      h('div',{class:'card'},h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px'},h('h3',{style:'font-size:18px'},'Budget du mois'),

/* ---------- Démarrage ---------- */
$('#today').textContent = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
{ const hash=(location.hash||'').slice(1); const t=lsGet('ssv.tab'); UI.tab=['moi','education','finance','skills','style','projets'].includes(hash)?hash:(t||'moi'); }
try{ const c=lsGet('ssv.cache'); if (c) S=hydrate(JSON.parse(c)); }catch(e){}
render();
(async()=>{
  const db = window.claude && window.claude.use ? await window.claude.use('db').catch(()=>null) : null;
  if (!db){ setSave('idle','Enregistré sur cet appareil'); return; }
  docRef = db.doc('life/state');
  setSave('idle','Synchronisation…');
  docRef.onSnapshot(snap=>{
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists){
      const d=snap.data(), j=stable(d);
      if (j!==lastJSON && !timer_pending()){ lastJSON=j; S=hydrate(clone(d)); lsSet('ssv.cache',JSON.stringify(S)); render(); }
    }
    setSave('saved','Synchronisé');
  }, ()=>setSave('error','Synchronisation interrompue. Recharge la page.'));
})();
function timer_pending(){ return writing || $('#save').dataset.s==='saving'; }
