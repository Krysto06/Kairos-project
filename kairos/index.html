<style>
/* Kairos : thèmes clair et sombre.
   Les couleurs sont des canaux RGB (« 24 24 48 ») pour profiter des opacités Tailwind (bg-ci/20…).
   Thème : attribut data-theme="light" | "dark" sur <html>. Sans attribut, le thème suit l'appareil (mode « Auto »). */
:root{
  --bg:255 255 255; --surface:255 255 255; --ink:24 24 48; --muted:92 98 124; --line:226 228 244; --soft:236 238 252;
  --me:190 242 234;  --me-ink:13 124 114;
  --edu:196 220 255; --edu-ink:37 99 235;
  --fin:186 242 206; --fin-ink:21 128 61;
  --sk:222 208 255;  --sk-ink:124 58 237;
  --sty:255 204 224; --sty-ink:219 39 119;
  --pro:255 226 160; --pro-ink:194 94 6;
  --gold:234 160 8; --warn:220 38 38; --btn:30 27 75; --btnink:255 255 255;
  --onci:255 255 255;           /* couleur du texte posé sur un fond --ci */
  --glow:.9;
  --page-bg:
    radial-gradient(900px 520px at 6% -4%, rgb(var(--sk) / .8), transparent 62%),
    radial-gradient(800px 480px at 98% 2%, rgb(var(--sty) / .75), transparent 62%),
    radial-gradient(1000px 620px at 50% 108%, rgb(var(--me) / .85), transparent 62%),
    #ffffff;
  --c:var(--me); --ci:var(--me-ink);
  color-scheme:light;
}
/* Sombre : fond graphite, accents adoucis (moins de saturation = moins de fatigue visuelle) */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:14 16 20; --surface:23 26 32; --ink:232 235 241; --muted:152 160 176; --line:42 47 58; --soft:31 35 44;
  --me:22 50 52;  --me-ink:112 212 212;
  --edu:26 42 70; --edu-ink:140 184 255;
  --fin:22 52 40; --fin-ink:120 214 160;
  --sk:42 35 68;  --sk-ink:192 168 255;
  --sty:60 30 42; --sty-ink:255 152 186;
  --pro:58 47 22; --pro-ink:244 198 92;
  --gold:230 188 84; --warn:255 140 120; --btn:232 235 241; --btnink:14 16 20; --onci:14 16 20;
  --glow:.12; --page-bg:rgb(var(--bg)); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:14 16 20; --surface:23 26 32; --ink:232 235 241; --muted:152 160 176; --line:42 47 58; --soft:31 35 44;
  --me:22 50 52;  --me-ink:112 212 212;
  --edu:26 42 70; --edu-ink:140 184 255;
  --fin:22 52 40; --fin-ink:120 214 160;
  --sk:42 35 68;  --sk-ink:192 168 255;
  --sty:60 30 42; --sty-ink:255 152 186;
  --pro:58 47 22; --pro-ink:244 198 92;
  --gold:230 188 84; --warn:255 140 120; --btn:232 235 241; --btnink:14 16 20; --onci:14 16 20;
  --glow:.12; --page-bg:rgb(var(--bg)); color-scheme:dark;
}

[data-c="me"]{--c:var(--me);--ci:var(--me-ink)}   [data-c="edu"]{--c:var(--edu);--ci:var(--edu-ink)}
[data-c="fin"]{--c:var(--fin);--ci:var(--fin-ink)} [data-c="sk"]{--c:var(--sk);--ci:var(--sk-ink)}
[data-c="sty"]{--c:var(--sty);--ci:var(--sty-ink)} [data-c="pro"]{--c:var(--pro);--ci:var(--pro-ink)}

html{background:rgb(var(--bg))}
body{
  font-family:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; margin:0; overflow-x:hidden;
  color:rgb(var(--ink)); background:var(--page-bg); background-attachment:fixed; background-color:rgb(var(--bg));
}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2px solid rgb(var(--edu-ink));outline-offset:2px}
.halo{position:fixed;border-radius:9999px;filter:blur(80px);opacity:var(--glow);pointer-events:none;z-index:0}

.view{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

/* Parcours en étapes */
.path{position:relative}
.path::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(rgb(var(--line)) 0 6px,transparent 6px 11px)}

/* Cases à cocher */
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;border:2px solid rgb(var(--line));border-radius:7px;display:grid;place-items:center;background:rgb(var(--surface));cursor:pointer;transition:all .15s}
.chk:checked{background:rgb(var(--ci));border-color:rgb(var(--ci))}
.chk:checked::after{content:"";width:5px;height:10px;border:solid rgb(var(--onci));border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}

/* Onglets : l'onglet actif prend la couleur de son domaine */
button[role="tab"][aria-selected="true"]{ background:rgb(var(--ci)) !important; color:rgb(var(--onci)) !important; box-shadow:0 8px 18px -8px rgb(var(--ci) / .7); }
button[role="tab"][aria-selected="true"] > span{ background:rgb(var(--onci)) !important; }
button[role="tab"][aria-selected="false"]:hover{ background:rgb(var(--c)) !important; color:rgb(var(--ci)); }

/* Anneaux de progression et barres */
[data-c] svg circle:first-of-type{ stroke:rgb(var(--ci) / .2); }
[data-c] [role="progressbar"]{ background:rgb(var(--ci) / .15); }
[data-c] [role="progressbar"] > div{ background:linear-gradient(90deg, rgb(var(--ci)), rgb(var(--ci) / .65)); }

/* Sections pliables */
.fold-chev{display:inline-block;transition:transform .2s ease;line-height:1}
.fold[data-open="false"] > .fold-head .fold-chev{transform:rotate(-90deg)}
.fold-head{background:none;border:0;padding:0;color:inherit;font:inherit;width:100%;text-align:left}

/* Champs de date lisibles partout (iOS affiche sinon un champ vide sans repère) */
input[type="date"],input[type="time"]{min-height:2.6rem;display:block;-webkit-appearance:none;appearance:none;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left}
input[type="date"]:not(:focus):invalid::-webkit-datetime-edit{color:rgb(var(--muted))}
select{color:inherit}
option{color:#111;background:#fff}

/* Images d'exercices */
.ex-img{aspect-ratio:4/3;object-fit:cover;width:100%;border-radius:.75rem;background:rgb(var(--soft))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex-img{filter:brightness(.92)}}
:root[data-theme="dark"] .ex-img{filter:brightness(.92)}

/* Tableau comparatif */
.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.cmp th,.cmp td{padding:.55rem .7rem;border-top:1px solid rgb(var(--line));text-align:left;vertical-align:top}
.cmp th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgb(var(--muted));font-weight:700;border-top:0;white-space:nowrap}

</style>

const pad2 = n => String(n).padStart(2,'0');

function isoAdd(iso, days){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+days); return isoOf(d); }

function dueLabel(due){ try{ return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(new Date(due+'T12:00:00')); }catch(e){ return due; } }

function daysTo(date){ const t=new Date(todayISO()+'T12:00:00'), d=new Date(date+'T12:00:00'); return Math.round((d-t)/86400000); }
function weekdayOf(iso){ return (new Date(iso+'T12:00:00').getDay()+6)%7+1; }   /* 1 = lundi … 7 = dimanche */
function mondayOf(iso){ return isoAdd(iso, 1-weekdayOf(iso)); }
function ageOf(birth){
  if (!birth) return '';
  const b=new Date(birth+'T12:00:00'); if (isNaN(b)) return '';
  const n=new Date(); let a=n.getFullYear()-b.getFullYear();
  if (n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  return a>=0 ? a+' ans' : '';
}

}

/* ---------- Thème : Auto → Clair → Sombre ---------- */
function themePref(){ const t=lsGet('kairos.theme'); return t==='light'||t==='dark'?t:'auto'; }
function applyTheme(){

/* ---------- Parcours (langues, diplômes) ---------- */
const trackById = id => TRACKS.find(t=>t.id===id);
/* Parcours libre d'une langue ou d'un diplôme : uniquement des étapes ajoutées par la personne */
const freeTrack = (key,title) => ({id:key,title:title||'Mes étapes',sub:'Tes propres étapes',desc:'',steps:[],virtual:true});
function trackSteps(tr){
  const custom = (S.custom[tr.id]||[]).map(c=>({id:c.id,t:c.t,d:c.d||'',due:c.due||'',links:c.url?[['Ouvrir le lien',c.url]]:[],mine:true}));

function langTracks(l){ return (l.tracks||[]).map(trackById).filter(Boolean).concat([freeTrack('lang-'+l.id,'Mes étapes')]); }
function langProg(l){ return sumProg(langTracks(l).map(trackProg)); }
function degTracks(g){ return (g.tracks||[]).map(trackById).filter(Boolean).concat(g.kind==='masters'?[]:[freeTrack('deg-'+g.id,'Mes étapes')]); }

function allSkills(){ return SKILLS.filter(s=>S.skillsOn.includes(s.id)).concat(S.customSkills); }

/* ---------- Budget ---------- */
function budgetCalc(){
  const b=S.budget, sal=+b.salary||0, by={besoin:0,epargne:0,invest:0,envie:0};
  for (const l of b.lines) by[l.kind]=(by[l.kind]||0)+(+l.amount||0);
  const spent=by.besoin+by.epargne+by.invest+by.envie;
  return {sal, by, spent, rest: sal-spent, saveRate: sal? (by.epargne+by.invest+Math.max(0,sal-spent))/sal : 0};

<script>
/* ---------- Migration : comptes créés avant la version 3 ----------
   La version 3 range les langues, diplômes et compétences dans l’état du compte (au lieu de les imposer à tout le monde).
   Cette fonction ne SUPPRIME rien : elle ajoute ce qui manque pour que l’ancien compte retrouve exactement ses rubriques, plus les nouveautés. */
function migrateLegacy(b, raw){
  try{ if (!lsGet('kairos.pre-v3')) lsSet('kairos.pre-v3', JSON.stringify(raw)); }catch(e){}   /* copie de sécurité locale */
  b.legacySeed = true;
  b.sport.cal = true;
  if (!b.langs.length) b.langs = [
    {id:'l-fr', name:'Français', tracks:[], readings:[]},
    {id:'l-en', name:'Anglais', tracks:['en','toefl'], readings:[]},
    {id:'l-es', name:'Espagnol', tracks:['es'], readings:[]}];
  if (!b.degrees.length) b.degrees = [
    {id:'d-lic', name:'Licence · mémoire', tracks:typeof TRACK_LIC!=='undefined'?['lic']:[]},
    {id:'d-gre', name:'GRE · préparation', tracks:['gre']},
    {id:'d-masters', name:'Master en finance de marché', kind:'masters'}];
  if (!b.skillsOn.length) b.skillsOn = SKILLS.map(s=>s.id);
  /* listes : on garde les anciennes définitions, puis on ajoute les listes génériques manquantes */
  if (typeof LEGACY_LIST_DEFS!=='undefined'){
    const ids = new Set(LEGACY_LIST_DEFS.map(d=>d.id));
    b.listDefs = LEGACY_LIST_DEFS.map(d=>Object.assign({},d)).concat(DEFAULT_LIST_DEFS.filter(d=>!ids.has(d.id)).map(d=>Object.assign({},d)));
  }
  /* budget : 4 enveloppes (besoins, épargne, investissement, envies) */
  for (const l of b.budget.lines) if (l.kind==='epargne' && /invest|formation|trading|retraite|avenir/i.test(l.label)) l.kind='invest';
  if (!b.budget.lines.some(l=>/trading/i.test(l.label))) b.budget.lines.push({id:'l'+uid(),label:'Trading (capital)',kind:'invest',amount:0});
}

function TrackFold(tr, idPrefix, c, def){

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Kairos · petit moteur PDF (jsPDF) : fiches de lecture, bilan financier mensuel ---------- */
function pdfSafe(s){
  return String(s==null?'':s)
    .replace(/[   ]/g,' ').replace(/−/g,'-').replace(/[–—]/g,'-')
    .replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...')
    .replace(/[•·]/g,'-').replace(/→/g,'->').replace(/[✓✔]/g,'x').replace(/[★☆]/g,'*')
    .replace(/[^\x09\x0a\x20-\x7e¡-ÿ€Œœ]/g,'');
}
function PDFDoc(o){
  if (!window.jspdf || !window.jspdf.jsPDF){ alert('Le module PDF n’a pas pu se charger. Vérifie ta connexion internet puis réessaie.'); return null; }
  const doc = new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const M=16, CW=210-2*M, BOTTOM=282;
  const INK=[24,24,48], MUTED=[100,106,130], ACC=o.accent||[37,99,235], SOFT=[238,240,252];
  let y=M;
  const lh = size => size*0.3528*1.32;
  const ensure = need => { if (y+need>BOTTOM){ doc.addPage(); y=M; return true; } return false; };
  const font = (size,bold,color) => { doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(...(color||INK)); };
  const api = {
    head(title, sub){
      doc.setFillColor(...ACC); doc.rect(0,0,210,30,'F');
      font(20,true,[255,255,255]); doc.text(pdfSafe(title),M,15);
      if (sub){ font(10.5,false,[255,255,255]); doc.text(pdfSafe(sub),M,23); }
      y=40;
    },
    h2(t){ ensure(16); y+=3; font(12.5,true,ACC); doc.text(pdfSafe(t),M,y); y+=2; doc.setDrawColor(...ACC); doc.setLineWidth(.4); doc.line(M,y,M+CW,y); y+=6; },
    p(t,opt){
      opt=opt||{}; const size=opt.size||10; font(size,opt.bold,opt.color);
      const lines = doc.splitTextToSize(pdfSafe(t||'—').replace(/—/g,'-'), CW-(opt.indent||0));
      for (const l of lines){ ensure(lh(size)); doc.text(l,M+(opt.indent||0),y); y+=lh(size); }
      y+=(opt.gap!=null?opt.gap:2);
    },
    kv(rows){
      for (const [k,v] of rows){
        const lines = doc.splitTextToSize(pdfSafe(v||'-'), CW-46);
        ensure(lh(10)*Math.max(1,lines.length)+1.5);
        font(9,true,MUTED); doc.text(pdfSafe(k),M,y);
        font(10,false,INK); lines.forEach((l,i)=>doc.text(l,M+46,y+i*lh(10)));
        y+=lh(10)*Math.max(1,lines.length)+1.5;
      }
      y+=2;
    },
    gap(n){ y+=n||4; },
    table(head, rows, fr, aligns){
      const widths = fr.map(f=>f*CW), pad=1.8, size=9;
      const drawRow = (cells, isHead) => {
        font(size,isHead,isHead?INK:INK);
        const wrapped = cells.map((c,i)=>doc.splitTextToSize(pdfSafe(c), widths[i]-2*pad));
        const hgt = Math.max(...wrapped.map(w=>w.length))*lh(size)+2*pad;
        if (ensure(hgt+(isHead?0:0))){ if (!isHead) drawRow(head,true); }
        if (isHead){ doc.setFillColor(...SOFT); doc.rect(M,y,CW,hgt,'F'); }
        let x=M;
        wrapped.forEach((lines,i)=>{
          lines.forEach((l,k)=>{ const tx = aligns&&aligns[i]==='r' ? x+widths[i]-pad : x+pad; doc.text(l,tx,y+pad+lh(size)*(k+.8),{align:aligns&&aligns[i]==='r'?'right':'left'}); });
          x+=widths[i];
        });
        y+=hgt; doc.setDrawColor(224,226,240); doc.setLineWidth(.2); doc.line(M,y,M+CW,y);
      };
      drawRow(head,true);
      if (!rows.length) drawRow(['Aucune ligne',...head.slice(1).map(()=>'')],false);
      rows.forEach(r=>drawRow(r,false));
      y+=4;
    },
    stat(items){   /* rangée de chiffres clés */
      const w=CW/items.length; ensure(22);
      items.forEach(([lab,val],i)=>{
        const x=M+i*w; doc.setFillColor(...SOFT); doc.roundedRect(x+(i?1.5:0),y,w-(i?1.5:0)-(i<items.length-1?1.5:0),18,2,2,'F');
        font(8,true,MUTED); doc.text(pdfSafe(lab).toUpperCase(),x+4+(i?1.5:0),y+6);
        font(13,true,INK); doc.text(pdfSafe(val),x+4+(i?1.5:0),y+14);
      });
      y+=24;
    },
    save(name){
      const n=doc.getNumberOfPages();
      for (let i=1;i<=n;i++){ doc.setPage(i); font(8,false,MUTED); doc.text('Kairos · '+pdfSafe(o.footer||'')+' · généré le '+new Intl.DateTimeFormat('fr-FR').format(new Date()),M,291); doc.text(i+' / '+n,210-M,291,{align:'right'}); }
      doc.save(name);
    }
  };
  return api;
}

<script>
/* ---------- Kairos · agenda : toutes les actions datées de l'application, au même endroit ----------
   Le calendrier, « Mes prochaines actions » (Page d'accueil) et le coach lisent tous cette même source. */
function billDue(b, ym){
  const d = Math.min(Math.max(1,+b.day||1), lastDayOf(ym));
  return ym+'-'+pad2(d);
}
function monthsBetween(from, to){
  const out=[]; let [y,m]=from.slice(0,7).split('-').map(Number); const end=to.slice(0,7);
  for (let i=0;i<40;i++){ const ym=y+'-'+pad2(m); out.push(ym); if (ym>=end) break; m++; if (m>12){ m=1; y++; } }
  return out;
}
/* D'où vient une étape personnalisée (clé de S.custom) ? */
function customOrigin(key){
  if (key.startsWith('skill:')){ const sk=allSkills().concat(SKILLS).find(s=>s.id===key.slice(6)); return {src:'Compétence · '+(sk?sk.title:''),go:'skills',c:'sk'}; }
  if (key.startsWith('lang-')){ const l=S.langs.find(x=>'lang-'+x.id===key); return {src:'Langue · '+(l?l.name:''),go:'langues',c:'edu'}; }
  if (key.startsWith('deg-')){ const g=S.degrees.find(x=>'deg-'+x.id===key); return {src:'Diplôme · '+(g?g.name:''),go:'diplomes',c:'edu'}; }
  const l=S.langs.find(x=>(x.tracks||[]).includes(key)); if (l) return {src:'Langue · '+l.name,go:'langues',c:'edu'};
  const g=S.degrees.find(x=>(x.tracks||[]).includes(key)); if (g) return {src:'Diplôme · '+g.name,go:'diplomes',c:'edu'};
  const t=trackById(key); return {src:t?t.title:'Parcours',go:'diplomes',c:'edu'};
}
function agendaEvents(from, to){
  const ev=[], inR = d => d && d>=from && d<=to, push = e => { if (inR(e.date)) ev.push(e); };
  for (const def of S.listDefs) for (const it of (S.lists[def.id]||[]))
    push({date:it.due,title:it.t,src:def.title,c:def.c||'pro',done:!!it.done,go:def.page||'perso',toggle:()=>{it.done=!it.done;save();render();}});
  for (const p of S.projects) for (const s of (p.subs||[]))
    push({date:s.due,title:s.t,src:'Projet · '+(p.name||'Sans titre'),c:'pro',done:!!s.done,go:'projets',toggle:()=>{s.done=!s.done;save();render();}});
  for (const d of S.family.dates) push({date:d.date,title:d.label,src:'Famille',c:'me',done:false,go:'famille'});
  for (const e of S.events) push({date:e.date,time:e.time||'',title:e.title,src:'Mon agenda',c:'edu',done:!!e.done,own:e.id,go:'calendrier',toggle:()=>{e.done=!e.done;save();render();}});
  for (const ym of monthsBetween(from,to)){
    for (const bl of S.budget.bills){ const paid=!!(bl.paid&&bl.paid[ym]); push({date:billDue(bl,ym),title:'Payer '+bl.label+(bl.amount?' ('+fmt(bl.amount)+')':''),src:'Factures',c:'fin',done:paid,go:'finance',recur:'MONTHLY',soft:true}); }
    push({date:ym+'-'+pad2(lastDayOf(ym)),title:'Exporter le bilan financier de '+monthLabel(ym),src:'Finances',c:'fin',done:!!S.budget.exported[ym],go:'finance',recur:'MONTHEND',soft:true});
  }
  for (const l of S.langs) for (const r of (l.readings||[])) if (r.status!=='fini') push({date:r.due,title:'Finir « '+r.title+' »',src:'Lecture · '+l.name,c:'edu',done:false,go:'langues'});
  for (const [key,arr] of Object.entries(S.custom)) for (const c of arr){
    if (!c.due) continue; const o=customOrigin(key);
    const done = key.startsWith('skill:') ? S.skillsDone.includes(key.slice(6)+':x:'+c.id) : S.done.includes(c.id);
    push({date:c.due,title:c.t,src:o.src,c:o.c,done,go:o.go,toggle:()=>{ if (key.startsWith('skill:')){ const k=key.slice(6)+':x:'+c.id; S.skillsDone=S.skillsDone.includes(k)?S.skillsDone.filter(x=>x!==k):S.skillsDone.concat(k); } else S.done=S.done.includes(c.id)?S.done.filter(x=>x!==c.id):S.done.concat(c.id); save(); render(); }});
  }
  for (const [id,u] of Object.entries(S.masters.uni||{})) if (u && u.deadline){ const m=MASTER_UNIS.find(x=>x.id===id); push({date:u.deadline,title:'Date limite de candidature · '+(m?m.short:id),src:'Diplômes',c:'edu',done:u.status==='envoye'||u.status==='admis',go:'diplomes'}); }
  if (S.sport.cal){
    const plan=S.sport.plan; let d=from;
    for (let i=0;i<400 && d<=to;i++, d=isoAdd(d,1)){
      for (const s of SPORT_SESSIONS){ if (+plan[s.id]===weekdayOf(d)){ const key=d; const doneL=(S.sport.log[key]||[]).includes(s.id);
        ev.push({date:d,title:'Séance '+s.id+' · '+s.name,src:'Sport',c:'me',done:doneL,go:'sport',soft:true,recur:'WEEKLY',toggle:()=>{ toggleSession(key,s.id); }}); } }
    }
  }
  return ev.sort((a,z)=>(a.date+(a.time||'99'))<(z.date+(z.time||'99'))?-1:(a.date+(a.time||'99'))>(z.date+(z.time||'99'))?1:0);
}
/* Actions à venir : en retard, du jour, puis les 2 semaines suivantes */
function upcomingActions(days){
  const t=todayISO(), all=agendaEvents(isoAdd(t,-60), isoAdd(t,days||14));
  const open=all.filter(e=>!e.done);
  return {
    late: open.filter(e=>e.date<t && !e.soft),
    today: open.filter(e=>e.date===t),
    soon: open.filter(e=>e.date>t)
  };
}

<script>
/* ---------- Coach du jour : un assistant qui lit tes données et te dit quoi faire maintenant ----------
   Page d'accueil : toutes les rubriques. Finances : uniquement l'argent. */
const TONES = {good:['bg-fin text-fin-ink','✓'], warn:['bg-sty text-sty-ink','!'], tip:['bg-pro text-pro-ink','→']};

function billsAlerts(){
  const ym=ymNow(), out=[];
  for (const b of (S.budget.bills||[])){
    if (b.paid && b.paid[ym]) continue;
    const due=billDue(b,ym), n=daysTo(due);
    if (n<=3) out.push({b,due,n});
  }
  return out.sort((x,y)=>x.n-y.n);
}
function billMsgs(){
  return billsAlerts().map(a=>{
    const when=a.n<0?'c’était prévu le '+dueLabel(a.due)+' ('+(-a.n)+' jour'+(-a.n>1?'s':'')+' de retard)':a.n===0?'c’est aujourd’hui':'dans '+a.n+' jour'+(a.n>1?'s':'');
    return {tone:a.n<0?'warn':'tip',text:'N’oublie pas de payer '+a.b.label+(a.b.amount?' ('+fmt(a.b.amount)+')':'')+' : '+when+'.',go:'finance',cta:'Voir les factures'};
  });
}
/* Rappel de fin de mois : les 3 derniers jours du mois, puis la première semaine du mois suivant */
function exportMsgs(){
  const out=[], t=todayISO(), ym=t.slice(0,7), d=+t.slice(8), last=lastDayOf(ym);
  const hasData = m => (S.budget.tx||[]).some(x=>x.date&&x.date.startsWith(m));
  if (d>=last-2 && hasData(ym) && !S.budget.exported[ym]) out.push({tone:'tip',text:'Fin de mois : exporte ton bilan financier de '+monthLabel(ym)+' en PDF.',cta:'Exporter le PDF',act:()=>exportBilan(ym)});
  if (d<=7){ const p=isoAdd(ym+'-01',-1).slice(0,7); if (hasData(p) && !S.budget.exported[p]) out.push({tone:'warn',text:'Tu n’as pas encore exporté le bilan de '+monthLabel(p)+'.',cta:'Exporter le PDF',act:()=>exportBilan(p)}); }
  return out;
}
function financeCoachMessages(){
  const out=billMsgs().concat(exportMsgs()), ym=ymNow(), c=finMonthCalc(ym), b=S.budget;
  if (!c.n) out.push({tone:'tip',text:'Aucune transaction notée ce mois-ci. Ajoute ton revenu et tes premières dépenses : je pourrai alors te dire comment tu t’en sors.'});
  else {
    const R=ruleCalc(ym);
    if (R.base){
      const rule=b.rule;
      for (const k of ['besoin','envie']) if (R.act[k] > R.base*rule[k]/100*1.05) out.push({tone:'warn',text:KINDS[k]+' : '+Math.round(R.act[k]/R.base*100)+' % de ton revenu ce mois-ci, pour une cible de '+rule[k]+' %. Il reste '+fmt(Math.max(0,R.base*rule[k]/100-R.act[k]))+' dans l’enveloppe.'});
      const saved=R.act.epargne+R.act.invest, target=R.base*(rule.epargne+rule.invest)/100, pct=Math.round(saved/R.base*100);
      if (saved>=target) out.push({tone:'good',text:'Bon mois : '+pct+' % mis de côté ou investi, pour une cible de '+(rule.epargne+rule.invest)+' %. Continue comme ça.'});
      else out.push({tone:'tip',text:'Épargne et investissement : '+pct+' % pour une cible de '+(rule.epargne+rule.invest)+' %. Il manque '+fmt(target-saved)+' pour l’atteindre.'});
    } else out.push({tone:'tip',text:'Ajoute ton salaire du mois (onglet Budget prévu) pour comparer ton mois à ta règle.'});
    if (c.rev>0 && c.solde<0) out.push({tone:'warn',text:'Tu as dépensé '+fmt(-c.solde)+' de plus que tes revenus ce mois-ci. Regarde d’abord les envies avant les besoins.'});
    const byCat={}; txMonth(ym).filter(t=>t.type==='depense').forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+(+t.amount||0); });
    for (const l of (b.lines||[])){ const sp=byCat[l.label]||0, pl=+l.amount||0; if (pl>0 && sp>pl) out.push({tone:'warn',text:'Budget « '+l.label+' » dépassé de '+fmt(sp-pl)+'.'}); }
  }
  if (b.goal && b.goal.target>0){
    const saved=(b.tx||[]).filter(t=>t.type==='epargne').reduce((x,t)=>x+(+t.amount||0),0), p=Math.round(Math.min(1,saved/b.goal.target)*100);
    out.push({tone:p>=100?'good':'tip',text:'Objectif'+(b.goal.label?' « '+b.goal.label+' »':'')+' : '+p+' % atteint ('+fmt(saved)+' sur '+fmt(b.goal.target)+').'});
  }
  return out.slice(0,6);
}
function homeCoachMessages(){
  const out=[], t=todayISO(), U=upcomingActions(7);
  if (U.late.length){ const e=U.late[0]; out.push({tone:'warn',text:U.late.length+' action'+(U.late.length>1?'s':'')+' en retard. La plus ancienne : « '+e.title+' » (prévue le '+dueLabel(e.date)+').',go:e.go,cta:'Ouvrir'}); }
  if (U.today.length) out.push({tone:'tip',text:'Aujourd’hui : '+U.today.slice(0,3).map(e=>e.title).join(' · ')+(U.today.length>3?' et '+(U.today.length-3)+' autre'+(U.today.length>4?'s':''):'')+'.',go:U.today[0].go,cta:'Ouvrir'});
  else if (U.soon.length){ const e=U.soon[0]; out.push({tone:'tip',text:'Rien de prévu aujourd’hui. Prochaine action : « '+e.title+' » '+(daysTo(e.date)===1?'demain':'le '+dueLabel(e.date))+'.',go:'calendrier',cta:'Voir le calendrier'}); }
  out.push(...billMsgs().slice(0,2), ...exportMsgs().slice(0,1));
  /* langues et diplômes : prochaine étape non cochée */
  const act=[]; S.langs.forEach(l=>langTracks(l).forEach(tr=>act.push({tr,src:l.name,go:'langues'}))); S.degrees.forEach(g=>degTracks(g).forEach(tr=>act.push({tr,src:g.name,go:'diplomes'})));
  for (const a of act){ const s=trackSteps(a.tr).find(x=>!isDone(x.id)); if (s && !a.tr.virtual){ out.push({tone:'tip',text:'Prochaine étape · '+a.src+' : '+s.t+'.',go:a.go,cta:'Ouvrir'}); break; } }
  for (const l of S.langs){ const r=(l.readings||[]).find(x=>x.status!=='fini'); if (r){ out.push({tone:'tip',text:'En cours de lecture : « '+r.title+' »'+(r.author?' de '+r.author:'')+'. Quand tu l’as fini, remplis ta fiche de lecture.',go:'langues',cta:'Mes lectures'}); break; } }
  const pr=S.projects.find(p=>p.status==='cours'&&(p.subs||[]).some(s=>!s.done)); if (pr){ const s=pr.subs.find(x=>!x.done); out.push({tone:'tip',text:'Projet « '+pr.name+' » : prochaine sous-action, « '+s.t+' ».',go:'projets',cta:'Ouvrir'}); }
  if (S.sport.cal){ const n=weekdayOf(t), s=SPORT_SESSIONS.find(x=>+S.sport.plan[x.id]===n); if (s && !(S.sport.log[t]||[]).includes(s.id)) out.push({tone:'tip',text:'Séance du jour : '+s.id+' · '+s.name+' ('+s.dur+').',go:'sport',cta:'Voir la séance'}); }
  const fm=finMonthCalc(ymNow()); if (fm.n && fm.rev) out.push({tone:fm.rate>=.2?'good':'tip',text:'Ce mois-ci : '+Math.round(fm.rate*100)+' % de ton revenu épargné. Les détails sont dans Finances.',go:'finance',cta:'Finances'});
  if (!S.profile.name) out.push({tone:'tip',text:'Commence par compléter ton profil (prénom, ville…) : je m’en servirai pour te parler.',cta:'Modifier mon profil',act:()=>{UI.editProfile=true;render();}});
  if (!out.length) out.push({tone:'good',text:'Tout est à jour. Ajoute une action avec une date, un projet ou une lecture : je te la rappellerai ici.'});
  return out.slice(0,6);
}
function greeting(){ const hr=new Date().getHours(); const w=hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir'; return w+(S.profile.name?' '+S.profile.name:'')+'.'; }
function vCoach(kind){
  const fin = kind==='finance';
  const msgs = fin ? financeCoachMessages() : homeCoachMessages();
  if (!msgs.length) return null;
  return h('div',{class:CARD+' border-ci','data-c':fin?'fin':'me'},
    h('div',{class:'mb-3'},h('h3',{class:'font-display text-xl font-extrabold text-ci'},fin?'Ton coach finances':'Ton coach du jour'),
      h('p',{class:'text-sm text-muted'},fin?'Uniquement ton argent : factures, enveloppes, épargne.':greeting()+' Voici ce qui compte maintenant.')),
    h('div',{class:'grid gap-2'},msgs.map(m=>h('div',{class:'flex flex-wrap items-center gap-3 rounded-2xl px-3.5 py-2.5 text-sm font-medium '+TONES[m.tone][0]},
      h('span',{class:'grid h-5 w-5 flex-none place-items-center rounded-full bg-surface/70 font-mono text-[11px] font-bold','aria-hidden':'true'},TONES[m.tone][1]),
      h('span',{class:'min-w-0 flex-1 break-words'},m.text),
      (m.go||m.act)?h('button',{type:'button',class:'flex-none rounded-lg bg-surface/70 px-2.5 py-1 text-xs font-semibold hover:bg-surface cursor-pointer',onclick:()=>m.act?m.act():go(m.go)},(m.cta||'Ouvrir')+' →'):null))));
}

<script>
/* ---------- Page d'accueil ---------- */
function pageListProg(page){
  return sumProg(S.listDefs.filter(d=>d.page===page).map(d=>listProg(d.id)));
}
function weekSportStats(){
  const mon=mondayOf(todayISO()), days=[0,1,2,3,4,5,6].map(i=>isoAdd(mon,i));
  const planned=SPORT_SESSIONS.filter(s=>+S.sport.plan[s.id]>0 && s.id!=='F').length;
  const done=days.reduce((n,d)=>n+((S.sport.log[d]||[]).filter(x=>x!=='F').length),0);
  return {planned, done};
}
function weekSpiritDays(){
  const t=todayISO(); let n=0; for (let i=0;i<7;i++){ const l=S.spirit.log[isoAdd(t,-i)]; if (l && Object.values(l).some(Boolean)) n++; } return n;
}

<script>
/* ---------- Finances : transactions, règle 60-15-15-10, factures, budget prévu, bilan PDF mensuel ---------- */
const TX_TYPES = {revenu:'Revenu', depense:'Dépense', epargne:'Épargne / investissement'};
const REV_CATS = ['Salaire','Freelance','Trading','Autre revenu','Cadeau','Vente'];
function txCats(type){
  const lines=S.budget.lines||[];
  if (type==='revenu') return REV_CATS;
  if (type==='epargne') return lines.filter(l=>l.kind==='epargne'||l.kind==='invest').map(l=>l.label).concat('Autre épargne');
  return lines.filter(l=>l.kind==='besoin'||l.kind==='envie').map(l=>l.label).concat('Autre');
}
function txMonth(ym){ return (S.budget.tx||[]).filter(t=>t.date && t.date.startsWith(ym)); }
function finMonthCalc(ym){
  const a=txMonth(ym), sum=ty=>a.filter(t=>t.type===ty).reduce((x,t)=>x+(+t.amount||0),0);
  const rev=sum('revenu'), dep=sum('depense'), epa=sum('epargne');
  return {rev, dep, epa, solde:rev-dep-epa, rate:rev?epa/rev:0, n:a.length};
}
/* À quelle enveloppe appartient une transaction ? Selon la ligne du budget qui porte le même nom */
function kindOfTx(t){
  const l=(S.budget.lines||[]).find(x=>x.label===t.cat);
  if (l) return l.kind;
  return t.type==='epargne' ? 'epargne' : (t.cat==='Autre'?'besoin':'besoin');
}
/* Règle : on compare chaque enveloppe au revenu du mois (ou au salaire prévu si aucun revenu n'est noté) */
function ruleCalc(ym){
  const c=finMonthCalc(ym), act={besoin:0,epargne:0,invest:0,envie:0};
  for (const t of txMonth(ym)) if (t.type!=='revenu') act[kindOfTx(t)]+=(+t.amount||0);
  return {base:c.rev||+S.budget.salary||0, act, rev:c.rev};
}
const RULE_C = {besoin:['bg-edu','text-edu-ink'], epargne:['bg-fin','text-fin-ink'], invest:['bg-sk','text-sk-ink'], envie:['bg-sty','text-sty-ink']};
const ruleLabel = () => KIND_ORDER.map(k=>S.budget.rule[k]).join('-');

/* ---------- Bilan PDF du mois ---------- */
function exportBilan(ym){
  const b=S.budget, doc=PDFDoc({accent:[22,120,87],footer:'Bilan financier '+ym});
  if (!doc) return;
  const c=finMonthCalc(ym), R=ruleCalc(ym), txs=txMonth(ym).sort((x,y)=>x.date<y.date?-1:1);
  doc.head('Bilan financier','Mois de '+monthLabel(ym)+(S.profile.name?' · '+S.profile.name:''));
  doc.stat([['Revenus',fmt(c.rev)],['Dépenses',fmt(c.dep)],['Épargne',fmt(c.epa)],['Reste',(c.solde<0?'-':'')+fmt(Math.abs(c.solde))]]);
  doc.h2('Ma règle '+ruleLabel()+' : réel contre cible');
  doc.table(['Enveloppe','Cible','Réel','Montant','Écart'],KIND_ORDER.map(k=>{
    const tg=b.rule[k], real=R.base?Math.round(R.act[k]/R.base*100):0, amt=R.act[k], diff=R.base?amt-R.base*tg/100:0;
    return [KINDS[k],tg+' %',R.base?real+' %':'-',fmt(amt),R.base?(diff>0?'+':'-')+fmt(Math.abs(diff)):'-'];}),[.34,.12,.12,.2,.22],['l','r','r','r','r']);
  const byCat={}; txs.filter(t=>t.type==='depense').forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+(+t.amount||0); });
  const planned={}; b.lines.forEach(l=>{ planned[l.label]=+l.amount||0; });
  const cats=Object.keys(byCat).sort((x,y)=>byCat[y]-byCat[x]);
  doc.h2('Dépenses par catégorie');
  doc.table(['Catégorie','Dépensé','Prévu'],cats.map(k=>[k,fmt(byCat[k]),planned[k]?fmt(planned[k]):'-']),[.5,.25,.25],['l','r','r']);
  doc.h2('Toutes les transactions');
  doc.table(['Date','Type','Catégorie / détail','Montant'],txs.map(t=>[dueLabel(t.date),TX_TYPES[t.type]||t.type,t.cat+(t.label&&t.label!==t.cat?' · '+t.label:''),(t.type==='revenu'?'+':'-')+fmt(t.amount)]),[.14,.22,.44,.2],['l','l','l','r']);
  const paid=b.bills.map(bl=>[bl.label,'le '+bl.day,fmt(bl.amount),bl.paid&&bl.paid[ym]?'Payée':'Non payée']);
  if (paid.length){ doc.h2('Factures récurrentes'); doc.table(['Facture','Échéance','Montant','Statut'],paid,[.4,.2,.2,.2],['l','l','r','l']); }
  if (b.goal&&b.goal.target>0){ const saved=b.tx.filter(t=>t.type==='epargne').reduce((x,t)=>x+(+t.amount||0),0); doc.h2('Objectif d’épargne'); doc.p((b.goal.label||'Objectif')+' : '+fmt(saved)+' sur '+fmt(b.goal.target)+' ('+Math.round(Math.min(1,saved/b.goal.target)*100)+' %).'); }
  doc.save('bilan-financier-'+ym+'.pdf');
  b.exported[ym]=todayISO(); save(); render();
}

/* ---------- Factures récurrentes ---------- */
function vBills(ym){
  const b=S.budget;
  const rows=b.bills.slice().sort((x,y)=>(+x.day||1)-(+y.day||1)).map(bl=>{
    const paid=!!(bl.paid&&bl.paid[ym]), due=billDue(bl,ym), late=!paid && daysTo(due)<0 && ym<=ymNow();
    return h('li',{class:'flex items-center gap-3 rounded-xl px-2 py-2 hover:bg-soft'},
      h('input',{type:'checkbox',class:'chk',id:'bill-'+bl.id,checked:paid,'aria-label':'Payée : '+bl.label,onchange:e=>{
        bl.paid=bl.paid||{};
        if (e.target.checked){ bl.paid[ym]=true; b.tx.push({id:'t-'+uid(),date:ym===ymNow()?todayISO():due,type:'depense',cat:'Autre',label:bl.label,amount:+bl.amount||0,bill:bl.id+'|'+ym}); }
        else { delete bl.paid[ym]; b.tx=b.tx.filter(t=>t.bill!==bl.id+'|'+ym); }
        save(); render(); }}),
      h('label',{for:'bill-'+bl.id,class:'min-w-0 flex-1 cursor-pointer'},h('span',{class:'block text-sm '+(paid?'line-through text-muted':'font-medium')},bl.label),h('small',{class:'block text-xs text-muted'},'Chaque mois, le '+bl.day)),
      chip(paid?'Payée':dueLabel(due),paid?'bg-soft text-muted':late?'bg-warn/15 text-warn':'bg-pro text-pro-ink'),
      h('span',{class:'flex-none font-mono text-sm font-semibold tabular-nums'},fmt(bl.amount)),
      xBtn('Retirer '+bl.label,()=>{ b.bills=b.bills.filter(x=>x.id!==bl.id); save(); render(); }));
  });
  const unpaid=b.bills.filter(x=>!(x.paid&&x.paid[ym])).length;
  return Fold({id:'fin-bills',c:'fin',title:'Factures à payer',sub:'Loyer, internet, électricité, école… elles apparaissent dans ton calendrier.',meta:pill(unpaid+' à payer')},()=>[
    rows.length?h('ul',{class:'grid gap-0.5'},rows):h('p',{class:'text-sm text-muted py-1'},'Aucune facture récurrente pour l’instant.'),
    h('div',{class:'mt-4 rounded-2xl bg-soft/60 p-4'},h('div',{class:'text-sm font-semibold mb-3'},'+ Ajouter une facture'),
      Form({cols:'sm:grid-cols-3',submit:'+ Ajouter',btnSpan:'sm:col-span-3',fields:[
        {k:'label',label:'Nom',ph:'Ex. : internet',req:true},{k:'amount',label:'Montant ('+b.currency+')',type:'number',step:'any',ph:'0'},{k:'day',label:'Jour du mois (1-31)',type:'number',min:1,max:31,ph:'5',req:true}],
        onSubmit:v=>{ const day=Math.round(+v.day); if (!(day>=1&&day<=31)) return; b.bills.push({id:'b-'+uid(),label:v.label,amount:+v.amount||0,day,paid:{}}); save(); render(); }}))]);
}

/* ---------- Règle 60-15-15-10 ---------- */
function ruleCard(ym){
  const b=S.budget, R=ruleCalc(ym), sum=KIND_ORDER.reduce((x,k)=>x+(+b.rule[k]||0),0);
  const pct=(k)=>R.base?R.act[k]/R.base:0;
  const rows=KIND_ORDER.map(k=>{
    const tg=+b.rule[k]||0, real=pct(k), over=(k==='besoin'||k==='envie') ? real*100>tg*1.05 : false, low=(k==='epargne'||k==='invest') ? R.base && real*100<tg : false;
    return h('div',{class:'grid gap-1.5'},
      h('div',{class:'flex flex-wrap items-baseline justify-between gap-2'},
        h('span',{class:'font-semibold text-sm'},KINDS[k]),
        h('span',{class:'font-mono text-xs '+(over?'text-warn font-semibold':'text-muted')},R.base?fmt(R.act[k])+' · '+Math.round(real*100)+' % (cible '+tg+' % = '+fmt(R.base*tg/100)+')':'cible '+tg+' %')),
      h('div',{class:'relative h-3 rounded-full bg-soft overflow-hidden'},
        h('div',{class:'h-full rounded-full '+(over?'bg-warn':RULE_C[k][0].replace('bg-','bg-')+' ')+' transition-all duration-500',style:'width:'+Math.min(100,real*100)+'%',...{}}),
        h('div',{class:'absolute top-0 h-full w-0.5 bg-ink/60',style:'left:'+Math.min(100,tg)+'%',title:'Cible '+tg+' %'})),
      low&&R.act[k]>=0?h('div',{class:'text-[12px] text-muted'},'Il manque '+fmt(R.base*tg/100-R.act[k])+' pour atteindre la cible.'):null);
  });
  const inputs=h('div',{class:'mt-4 grid gap-3 grid-cols-2 sm:grid-cols-4'},KIND_ORDER.map(k=>h('div',{class:'grid gap-1'},
    h('label',{class:LABEL,for:'rule-'+k},KINDS[k]+' (%)'),
    h('input',{class:IN+' font-mono text-right',id:'rule-'+k,type:'number',min:0,max:100,inputmode:'numeric',value:b.rule[k],onchange:e=>{ b.rule[k]=Math.max(0,Math.min(100,+e.target.value||0)); save(); render(); }}))));
  return h('div',{class:CARD,'data-c':'fin'},
    h('div',{class:'flex flex-wrap items-center justify-between gap-2 mb-1'},h('h3',{class:'font-display text-xl font-extrabold'},'Ma règle '+ruleLabel()),
      h('button',{type:'button',class:GHOST,onclick:()=>{ b.rule=Object.assign({},DEFAULT_RULE); save(); render(); }},'Remettre 60-15-15-10')),
    h('p',{class:'text-sm text-muted mb-4'},'Besoins 60 %, épargne 15 %, investissement 15 %, envies 10 % de ton revenu du mois. '+(R.base?'Base de ce mois : '+fmt(R.base)+(R.rev?' (revenus notés).':' (salaire prévu).'):'Note un revenu ou un salaire prévu pour voir la comparaison.')),
    h('div',{class:'grid gap-4'},rows),
    inputs,
    sum!==100?h('p',{class:'mt-3 rounded-xl bg-warn/15 px-3 py-2 text-sm text-warn'},'Attention : tes pourcentages font '+sum+' % au lieu de 100 %.'):null,
    h('p',{class:'mt-3 text-xs text-muted'},'Les enveloppes se calculent avec le nom de la catégorie : chaque ligne du budget prévu appartient à une enveloppe. Les pourcentages sont modifiables.'));
}

/* ---------- Budget prévu ---------- */
function vFinBudget(){
  const b=S.budget, month=monthLabel(ymNow());
  const chart=h('div',{class:'grid gap-4'}), insight=h('p',{class:'mt-5 rounded-2xl bg-fin/60 px-4 py-3 text-sm'});
  const out={}, pctCells={};
  const SEG={besoin:'bg-edu text-edu-ink',envie:'bg-sty text-sty-ink',epargne:'bg-fin text-fin-ink',invest:'bg-sk text-sk-ink',reste:'text-muted'};
  function paint(){
    const c=budgetCalc();
    out.spent.textContent=fmt(c.spent); out.rest.textContent=fmt(c.rest); out.rest.classList.toggle('text-warn', c.rest<0);
    out.rate.textContent=c.sal?Math.round(c.saveRate*100)+' %':'–';
    const seg=(k,v,lab)=>h('span',{class:'flex items-center justify-center overflow-hidden whitespace-nowrap font-mono text-[11px] font-semibold transition-all duration-500 '+SEG[k],style:`flex:0 0 ${Math.max(0,v)*100}%`,title:`${lab} : ${Math.round(v*100)} %`},v>=.08?Math.round(v*100)+' %':'');
    const tot=Math.max(c.sal,c.spent)||1;
    const row=(l,...segs)=>h('div',{class:'grid grid-cols-[96px_1fr] sm:grid-cols-[120px_1fr] items-center gap-3'},h('span',{class:EYEBROW},l),h('div',{class:'flex h-9 overflow-hidden rounded-xl bg-soft'},segs));
    chart.replaceChildren(
      row('Ton mois',...KIND_ORDER.map(k=>seg(k,c.by[k]/tot,KINDS[k])),c.rest>0?seg('reste',c.rest/tot,'Non affecté'):null),
      row('Règle '+ruleLabel(),...KIND_ORDER.map(k=>seg(k,(+b.rule[k]||0)/100,KINDS[k]))),
      h('div',{class:'flex flex-wrap gap-4 text-[13px] text-muted'},KIND_ORDER.map(k=>h('span',{class:'inline-flex items-center gap-1.5'},h('i',{class:'inline-block h-2.5 w-2.5 rounded '+RULE_C[k][0]}),KINDS[k]))));

/* ---------- Calendrier : toutes tes actions datées, ajout à Google Agenda, export .ics avec rappels ---------- */
const d8 = iso => iso.replace(/-/g,'');
const t6 = (iso,time) => d8(iso)+'T'+time.replace(':','')+'00';
function endOf(iso,time){ const t=new Date(iso+'T'+time+':00'); t.setHours(t.getHours()+1); return isoOf(t).replace(/-/g,'')+'T'+pad2(t.getHours())+pad2(t.getMinutes())+'00'; }
function gcalUrl(e){
  const dates = e.time ? t6(e.date,e.time)+'/'+endOf(e.date,e.time) : d8(e.date)+'/'+d8(isoAdd(e.date,1));
  const rr = e.recur==='MONTHEND'?'RRULE:FREQ=MONTHLY;BYMONTHDAY=-1':e.recur?'RRULE:FREQ='+e.recur:'';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dates+'&details='+encodeURIComponent('Ajouté depuis Kairos ('+e.src+')')+(rr?'&recur='+encodeURIComponent(rr):'');
}
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
/* Export : les 400 prochains jours. Les rendez-vous qui reviennent (factures, bilan de fin de mois, séances) deviennent un seul événement récurrent. */
function exportICS(){
  const t=todayISO(), stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''), seen=new Set();
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kairos//FR','CALSCALE:GREGORIAN'];
  agendaEvents(t,isoAdd(t,400)).filter(e=>e.recur||!e.done).forEach((e,i)=>{
    if (e.recur){ const k=e.recur+'|'+e.title.replace(/\([^)]*\)/,'').trim(); if (seen.has(k)) return; seen.add(k); }
    lines.push('BEGIN:VEVENT','UID:kairos-'+i+'-'+d8(e.date)+'-'+uid()+'@kairos.local','DTSTAMP:'+stamp);
    if (e.time) lines.push('DTSTART:'+t6(e.date,e.time),'DTEND:'+endOf(e.date,e.time)); else lines.push('DTSTART;VALUE=DATE:'+d8(e.date),'DTEND;VALUE=DATE:'+d8(isoAdd(e.date,1)));
    lines.push('SUMMARY:'+icsEscape(e.title),'DESCRIPTION:'+icsEscape('Kairos · '+e.src));
    if (e.recur) lines.push(e.recur==='MONTHEND'?'RRULE:FREQ=MONTHLY;BYMONTHDAY=-1':'RRULE:FREQ='+e.recur);
    lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(e.title),e.time?'TRIGGER:-PT15M':'TRIGGER:PT9H','END:VALARM','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  downloadText('kairos-calendrier.ics',lines.join('\r\n'),'text/calendar');
}

    {k:'date',label:'Date',type:'date',value:today.startsWith(ym)?today:ym+'-01',req:true,quick:true},{k:'time',label:'Heure (optionnel)',type:'time'}],
    onSubmit:v=>{ S.events.push({id:'e-'+uid(),title:v.title,date:v.date,time:v.time}); UI.calMonth=v.date.slice(0,7); save(); render(); }});
  const agenda=all.length?h('ul',{class:'grid gap-1'},all.map(e=>h('li',{'data-c':e.c,class:'flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl px-2 py-2 hover:bg-soft'},

      h('span',{class:'min-w-0 flex-1'},h('span',{class:'block text-sm font-medium break-words '+(e.done?'line-through text-muted':'')},(e.time?e.time+' · ':'')+e.title),h('small',{class:'block text-xs text-muted'},e.src)),
      h('a',{class:GHOST,href:gcalUrl(e),target:'_blank',rel:'noopener',title:'Ajouter à Google Agenda'},'Google Agenda ↗'),
      e.go&&e.go!=='calendrier'?h('button',{type:'button',class:GHOST,onclick:()=>go(e.go)},'Ouvrir'):null,
      e.own?xBtn('Retirer '+e.title,()=>{ S.events=S.events.filter(x=>x.id!==e.own); save(); render(); }):null)))
    :h('p',{class:'text-sm text-muted'},'Rien de prévu ce mois-ci.');
  return h('section',{class:'view grid gap-5','data-c':'edu'},
    secHead('Calendrier','Toutes tes actions datées au même endroit : listes, projets, étapes, lectures, factures, séances de sport et rendez-vous. C’est ce calendrier qui alimente « Mes prochaines actions ».',

    h('div',{class:CARD},

      h('div',{class:'grid grid-cols-7 gap-1.5'},cells)),
    h('div',{class:'grid gap-5 lg:grid-cols-[1.4fr_1fr]'},

function downloadText(name, text, type){
  const url=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));
  const a=h('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}

      fileIn=h('input',{type:'file',accept:'.json,application/json',class:'hidden',id:'restore-file',onchange:e=>{
        const f=e.target.files&&e.target.files[0]; if(!f) return;
        f.text().then(t=>{ let d; try{ d=JSON.parse(t); }catch(err){ alert('Ce fichier n’est pas une sauvegarde Kairos valide.'); return; }
          if (!d || typeof d!=='object' || !d.profile){ alert('Ce fichier n’est pas une sauvegarde Kairos valide.'); return; }
          if (!confirm('Remplacer tes données actuelles par cette sauvegarde ?')) return;
          S=hydrate(d); save(); render(); }); e.target.value=''; }})));
}

<script>
/* Configuration de la connexion (Supabase).
   Ces deux valeurs sont publiques par conception : ce sont les règles de sécurité de la base
   (Row Level Security) qui protègent tes données, pas le secret de cette clé. */
const SUPABASE_URL = "https://eacrxvxrylxrwzyrarou.supabase.co";
const SUPABASE_KEY = "sb_publishable_AEm8LgFx62Z4gekl_lJQwA_-JfutR0j";
/* true = le bouton « Créer mon compte » est visible. Mets false une fois ton compte créé. */
const ALLOW_SIGNUP = false;

<script>
/* Connexion Kairos : email + mot de passe (Supabase Auth) et données dans Supabase (table kairos_state).
   Dans Claude (aperçu avec la base intégrée), la connexion est ignorée. */
const Auth = (() => {
  const inClaude = !!(window.claude && window.claude.use);
  let sb = null;
  const cfgOk = () => typeof SUPABASE_URL === "string" && /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && typeof SUPABASE_KEY === "string" && SUPABASE_KEY.length > 20;
  const back = () => location.origin + location.pathname;

  const css = document.createElement("style");
  css.textContent = "body.locked #main,body.locked #tabs,body.locked header,body.locked footer{display:none!important}";
  document.head.appendChild(css);
  if (!inClaude) document.body.classList.add("locked");

  const ERR = {
    invalid_credentials: "Email ou mot de passe incorrect.",
    email_not_confirmed: "Ton email n'est pas encore confirmé. Ouvre le message que nous t'avons envoyé et clique sur le lien.",
    user_already_exists: "Un compte existe déjà avec cet email. Connecte-toi.",
    email_exists: "Un compte existe déjà avec cet email. Connecte-toi.",
    weak_password: "Mot de passe trop faible : 6 caractères minimum.",
    validation_failed: "Cet email n'a pas l'air valide.",
    email_address_invalid: "Cet email n'a pas l'air valide.",
    over_email_send_rate_limit: "Trop d'emails envoyés pour le moment. Attends une heure puis réessaie.",
    over_request_rate_limit: "Trop d'essais. Attends quelques minutes puis réessaie.",
    signup_disabled: "La création de compte est désactivée.",
    email_provider_disabled: "La connexion par email n'est pas activée dans Supabase."
  };
  const msg = e => {
    if (!e) return "Erreur inconnue.";
    if (ERR[e.code]) return ERR[e.code];
    const m = String(e.message || e);
    if (/Failed to fetch|NetworkError|network/i.test(m)) return "Pas de connexion internet.";
    if (/Invalid login credentials/i.test(m)) return ERR.invalid_credentials;
    if (/already registered/i.test(m)) return ERR.user_already_exists;
    if (/Email not confirmed/i.test(m)) return ERR.email_not_confirmed;
    if (/rate limit/i.test(m)) return ERR.over_email_send_rate_limit;
    return "Erreur : " + m;
  };

  let gate = null;
  function shell(inner) {
    if (!gate) { gate = document.createElement("div"); gate.id = "gate"; document.body.appendChild(gate); }
    gate.className = "fixed inset-0 z-[100] overflow-y-auto bg-bg";
    gate.style.cssText = "background-image:radial-gradient(60% 50% at 10% 0%,rgb(var(--edu)),transparent),radial-gradient(50% 45% at 100% 10%,rgb(var(--sty)),transparent),radial-gradient(60% 50% at 40% 100%,rgb(var(--fin)),transparent)";
    gate.replaceChildren(h("div", { class: "min-h-full grid place-items-center px-4 py-10" }, inner));
  }
  const logo = () => h("h1", { class: "font-display font-extrabold text-5xl tracking-tight text-center" }, "Kai", h("span", { class: "bg-gradient-to-r from-edu-ink via-sk-ink to-sty-ink bg-clip-text text-transparent" }, "ros"));
  const CARD_W = "w-full max-w-md rounded-3xl bg-surface/90 backdrop-blur-xl ring-1 ring-line/80 shadow-lift p-6 sm:p-8 grid gap-4";

  function showSetup() {
    shell(h("div", { class: CARD_W }, logo(),
      h("p", { class: "text-center font-semibold" }, "La connexion n'est pas encore configurée."),
      h("p", { class: "text-sm text-muted" }, "Le propriétaire doit renseigner SUPABASE_URL et SUPABASE_KEY dans js/supabase-config.js.")));
  }
  function showFatal(t) {
    shell(h("div", { class: CARD_W }, logo(), h("p", { class: "text-center text-sm text-warn font-semibold" }, t)));
  }

  /* Formulaire « nouveau mot de passe » (après clic sur le lien de réinitialisation) */
  function showNewPassword() {
    let err = "", busy = false;
    const draw = () => {
      let pw;
      const submit = async e => {
        e.preventDefault();
        if (busy) return;
        busy = true; err = ""; draw();
        const { error } = await sb.auth.updateUser({ password: pw.value });
        if (error) { err = msg(error); busy = false; draw(); }
        else { history.replaceState(null, "", back()); location.reload(); }
      };
      pw = h("input", { class: IN, id: "np", type: "password", autocomplete: "new-password", required: true, minlength: 6, placeholder: "••••••••" });
      shell(h("div", { class: CARD_W },
        logo(), h("p", { class: "text-center text-muted -mt-2" }, "Choisis ton nouveau mot de passe."),
        h("form", { class: "grid gap-4", onsubmit: submit },
          h("div", { class: "grid gap-1" }, h("label", { class: LABEL, for: "np" }, "Nouveau mot de passe"), pw),
          err ? h("p", { class: "rounded-xl bg-warn/10 px-3 py-2 text-sm font-semibold text-warn", role: "alert" }, err) : null,
          h("button", { class: BTN + " w-full py-3 text-base", type: "submit", disabled: busy }, busy ? "Un instant…" : "Enregistrer"))));
    };
    draw();
  }

  function showLogin(finish) {
    let mode = "in", busy = false, info = "", err = "";
    const draw = () => {
      let em, pw;
      const submit = async e => {
        e.preventDefault();
        if (busy) return;
        const a = em.value.trim(), b = pw.value;
        err = ""; info = ""; busy = true; draw0(true, a);
        try {
          if (mode === "up") {
            const { data, error } = await sb.auth.signUp({ email: a, password: b, options: { emailRedirectTo: back() } });
            if (error) throw error;
            if (data.session) return finish(data.session.user);
            if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw { code: "user_already_exists" };
            mode = "in"; busy = false;
            info = "Compte créé. Un email de confirmation a été envoyé à " + a + ". Clique sur le lien (regarde aussi tes spams), puis reviens te connecter.";
            return draw0(false, a);
          }
          const { data, error } = await sb.auth.signInWithPassword({ email: a, password: b });
          if (error) throw error;
          finish(data.session.user);
        } catch (x) { err = msg(x); busy = false; draw0(false, a); }
      };
      const reset = async () => {
        const a = em.value.trim();
        if (!a) { err = "Écris d'abord ton email, puis clique sur « Mot de passe oublié »."; info = ""; return draw0(false, a); }
        const { error } = await sb.auth.resetPasswordForEmail(a, { redirectTo: back() });
        if (error) { err = msg(error); info = ""; } else { info = "Email envoyé à " + a + ". Regarde aussi tes spams."; err = ""; }
        draw0(false, a);
      };
      const eye = h("button", { type: "button", class: "absolute right-2 top-1/2 -translate-y-1/2 text-xs font-semibold text-muted hover:text-ci px-2 py-1 cursor-pointer", onclick: () => { pw.type = pw.type === "password" ? "text" : "password"; eye.textContent = pw.type === "password" ? "Voir" : "Cacher"; } }, "Voir");
      const form = h("form", { class: "grid gap-4", onsubmit: submit },
        h("div", { class: "grid gap-1" }, h("label", { class: LABEL, for: "lg-email" }, "Email"),
          em = h("input", { class: IN, id: "lg-email", type: "email", autocomplete: "username", inputmode: "email", required: true, placeholder: "toi@exemple.com" })),
        h("div", { class: "grid gap-1" }, h("label", { class: LABEL, for: "lg-pw" }, "Mot de passe"),
          h("div", { class: "relative" }, pw = h("input", { class: IN + " pr-16", id: "lg-pw", type: "password", autocomplete: mode === "up" ? "new-password" : "current-password", required: true, minlength: 6, placeholder: "••••••••" }), eye)),
        err ? h("p", { class: "rounded-xl bg-warn/10 px-3 py-2 text-sm font-semibold text-warn", role: "alert" }, err) : null,
        info ? h("p", { class: "rounded-xl bg-fin px-3 py-2 text-sm font-semibold text-fin-ink", role: "status" }, info) : null,
        h("button", { class: BTN + " w-full py-3 text-base", type: "submit", disabled: busy }, busy ? "Un instant…" : (mode === "up" ? "Créer mon compte" : "Me connecter")),
        h("div", { class: "flex flex-wrap items-center justify-between gap-2 text-[13px]" },
          mode === "in" ? h("button", { type: "button", class: "font-semibold text-muted hover:text-ci cursor-pointer", onclick: reset }, "Mot de passe oublié ?") : h("span"),
          (typeof ALLOW_SIGNUP !== "undefined" && ALLOW_SIGNUP)
            ? h("button", { type: "button", class: "font-semibold text-ci cursor-pointer", onclick: () => { mode = mode === "in" ? "up" : "in"; err = ""; info = ""; draw0(false, em.value); } }, mode === "in" ? "Créer mon compte" : "J'ai déjà un compte")
            : null));
      shell(h("div", { class: "w-full max-w-sm rounded-3xl bg-surface/90 backdrop-blur-xl ring-1 ring-line/80 shadow-lift p-6 sm:p-8 grid gap-5 border-t-4 border-ci/70", "data-c": "me" },
        logo(), h("p", { class: "text-center text-muted -mt-2" }, mode === "up" ? "Crée ton compte personnel." : "Connecte-toi pour retrouver ton tableau de bord."), form));
      return { em, pw };
    };
    function draw0(disabled, email) {
      const r = draw();
      if (email) r.em.value = email;
      if (disabled) { r.em.disabled = r.pw.disabled = true; }
      else (email ? r.pw : r.em).focus();
    }
    draw0(false);
  }

  function mountLogout(user) {
    const old = document.getElementById("logout"); if (old) old.remove();
    const b = h("button", { id: "logout", class: GHOST, title: user.email || "", onclick: () => {
      try { localStorage.removeItem("ssv.cache"); localStorage.removeItem("ssv.uid"); } catch (e) {}
      setTimeout(() => sb.auth.signOut().finally(() => location.reload()), 900);
    } }, "Se déconnecter");
    const save = document.getElementById("save");
    if (save && save.parentNode) save.parentNode.appendChild(b);
  }

  /* Même interface que l'ancienne base : doc().set(d) et doc().onSnapshot(ok, err) */
  function dbFor(user) {
    const snapOf = json => ({ metadata: { hasPendingWrites: false, fromCache: false }, exists: json != null, data: () => json });
    return { doc: () => ({
      set: async d => {
        const { error } = await sb.from("kairos_state").upsert({ user_id: user.id, json: d, updated_at: new Date().toISOString() });
        if (error) throw error;
      },
      onSnapshot: (ok, err) => {
        const load = async () => {
          const { data, error } = await sb.from("kairos_state").select("json").eq("user_id", user.id).maybeSingle();
          if (error) { if (err) err(error); return; }
          ok(snapOf(data ? data.json : null));
        };
        load();
        try {
          sb.channel("kairos-" + user.id)
            .on("postgres_changes", { event: "*", schema: "public", table: "kairos_state", filter: "user_id=eq." + user.id },
              p => { if (p.new && p.new.json) ok(snapOf(p.new.json)); })
            .subscribe();
        } catch (e) { /* le temps réel est facultatif */ }
        document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
        return () => {};
      }
    }) };
  }

  function start() {
    if (inClaude) return Promise.resolve({ user: null });
    if (!cfgOk()) { showSetup(); return new Promise(() => {}); }
    if (typeof supabase === "undefined" || !supabase.createClient) { showFatal("Impossible de charger le service de connexion. Vérifie ta connexion internet puis recharge la page."); return new Promise(() => {}); }
    try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); }
    catch (e) { showFatal(msg(e)); return new Promise(() => {}); }
    return new Promise(resolve => {
      let done = false, recovery = false;
      const finish = u => {
        if (done) return;
        done = true;
        document.body.classList.remove("locked");
        if (gate) { gate.remove(); gate = null; }
        const user = { uid: u.id, email: u.email };
        mountLogout(user);
        resolve({ user, db: dbFor(u) });
      };
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { recovery = true; showNewPassword(); }
        else if (event === "SIGNED_IN" && session && !recovery && !done) finish(session.user);
        else if (event === "SIGNED_OUT" && done) location.reload();
      });
      sb.auth.getSession().then(({ data }) => {
        if (recovery || done) return;
        if (data && data.session) finish(data.session.user);
        else setTimeout(() => { if (!done && !recovery) showLogin(finish); }, 50);
      });
    });
  }
  return { start };
})();

</script>
<script>
/* ---------- Kairos · rendu, navigation, démarrage ---------- */
function render(){
  if (typing()){ deferRender=true; return; }
  UI.foldIds=[];
  renderTabs();
  const views={accueil:vAccueil,famille:vFamille,projets:vProj,perso:vPerso,langues:vLangues,diplomes:vDiplomes,skills:vSkills,finance:vFin,style:vStyle,sport:vSport,spirit:vSpirit,calendrier:vCalendrier};
  const y=window.scrollY;
  $('#main').replaceChildren((views[UI.tab]||vAccueil)());
  window.scrollTo(0,y);
  $('#greet').textContent = greeting()+' Voici où tu en es.';
}
function go(tab, track){
  UI.tab=tab; if (track){ UI.track=track; lsSet('ssv.track',track); }
  lsSet('ssv.tab',tab); try{ history.replaceState(null,'','#'+tab) }catch(e){}
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Démarrage ---------- */
applyTheme();
$('#theme-btn').addEventListener('click',cycleTheme);
if (window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}
$('#today').textContent = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
{
  const alias={moi:'accueil'}, ids=TABS.map(x=>x[0]);
  const hash=alias[(location.hash||'').slice(1)]||(location.hash||'').slice(1), t0=lsGet('ssv.tab'), t=alias[t0]||t0;
  UI.tab=ids.includes(hash)?hash:(ids.includes(t)?t:'accueil');
}
function boot(auth){
  const uid = auth && auth.user ? auth.user.uid : null;
  try{ if (uid){ const old=lsGet('ssv.uid'); if (old && old!==uid) localStorage.removeItem('ssv.cache'); lsSet('ssv.uid',uid); } }catch(e){}
  try{ const c=lsGet('ssv.cache'); S=hydrate(c?JSON.parse(c):null); }catch(e){ S=hydrate(null); }
  render();
  (async()=>{
    const db = uid ? auth.db : (window.claude && window.claude.use ? await window.claude.use('db').catch(()=>null) : null);
    if (!db){ setSave('idle','Enregistré sur cet appareil'); return; }
    docRef = db.doc('life/state');
    setSave('idle','Synchronisation…');
    docRef.onSnapshot(snap=>{
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists){
        const d=snap.data(), j=stable(d);
        if (j!==lastJSON && !busy()){ lastJSON=j; S=hydrate(clone(d)); lsSet('ssv.cache',JSON.stringify(S)); render(); }
      } else if (uid && !snap.metadata.fromCache){ save(); }
      setSave('saved','Synchronisé');
    }, ()=>setSave('error','Synchronisation interrompue. Recharge la page.'));
  })();
}
Auth.start().then(boot);

</script>
